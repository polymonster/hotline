[package]
name = "ecs_examples"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib for the hot reloading client, rlib to link statically into plugins/ecs_examples_app
crate-type = ["cdylib", "rlib"]

[dependencies]
hotline-rs.workspace = true
export_macros = { path = "../export_macros" }
ecs = { path = "../ecs" }
maths-rs.workspace = true
bevy_ecs.workspace = true
rand = "0.8.5"
bitflags.workspace = true
